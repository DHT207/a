<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Interactive Photo Gallery</title>
    <link rel="stylesheet" href="gallery.css">
    <script src="gallery.js"></script>
</head>
<body>

    <!-- Khung hiển thị lớn ban đầu -->
    <div id="image">
        Hover over an image below to display here.
    </div>

    <!-- Các hình ảnh nhỏ trong thư viện -->
    <div class="gallery">
        <img class="preview" alt="Stylized Petals" src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/389/petals.jpg" onmouseover="upDate(this)" onmouseout="undo()">
        
        <img class="preview" alt="Sunflower and Bees" src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/389/sunflower.jpg" onmouseover="upDate(this)" onmouseout="undo()">
        
        <img class="preview" alt="Street View" src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/389/street.jpg" onmouseover="upDate(this)" onmouseout="undo()">
    </div>

</body>
</html>
